[project]
name = "tcc-diag"
version = "0.1.0"
description = "Ferramenta híbrida de auxílio ao diagnóstico médico: visão computacional (pneumonia) + predição tabular explicável (risco cardíaco)."
authors = [{ name = "Matheus Rodrigues Silva Maia" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- núcleo científico ---
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "pyarrow",
    "pyyaml",
    "joblib",
    "tqdm",
    # --- notebooks ---
    "jupyterlab",
    "ipykernel",
    "ipywidgets",
    # --- módulo tabular ---
    "xgboost",
    "lightgbm",
    "catboost",
    "optuna",
    "shap",
    "lime",
    "statsmodels",
    "scikit-posthocs",
    # --- módulo de visão ---
    "torch",
    "torchvision",
    "opencv-python-headless",
    "pydicom",
    "pillow",
    "imagehash",
    "grad-cam",
    # --- aplicação ---
    "streamlit",
    "pydantic",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "kaggle",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcc_diag"]

# PyTorch com suporte a CUDA 12.8 (driver NVIDIA 581.95 é compatível).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["explore"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
